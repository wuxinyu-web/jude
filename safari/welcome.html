<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>句得</title><style>body{margin:0;padding:calc(48px + env(safe-area-inset-top)) 26px 32px;background:#f7f4ed;color:#2a3029;font:17px/1.7 system-ui}h1{font-size:38px;line-height:1.1;margin-bottom:12px}p{color:#61675f}li{margin:18px 0}small{font-size:14px}ol{padding-left:24px}</style><body><h1>句得</h1><p>把看过的视频，变成学会的表达。</p><ol><li>打开 iPhone「设置 → App → Safari → 扩展」，启用句得。</li><li>在 Safari 打开 YouTube 或哔哩哔哩的视频网页，允许句得访问。</li><li>从 Safari 页面菜单打开句得，先设置字幕与 AI 服务，再打开学习区。</li></ol><p>视频在上，字幕和收藏在下。轻点单词查词，长按选择句子收藏。</p><small>请在 Safari 网页内使用。iPhone Chrome、YouTube App 和哔哩哔哩 App 不支持此扩展。电脑上的收藏和服务设置不会自动同步到手机。</small></body></html>

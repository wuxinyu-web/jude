<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频英语学习</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="lib/learning.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "视频英语学习" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="layout-actions" aria-label="调整学习区">
          <button type="button" id="enterImmersive" class="layout-watch" title="放大视频，自动显示中英双语台词">▣ 专心看</button>
          <button type="button" id="moveLearningPanel" title="调整完整学习区的位置">放到下方 ↓</button>
        </div><span id="layoutStatus" role="status" aria-live="polite"></span>
        <button
          class="settings-btn"
          id="settingsBtn"
          type="button"
          title="打开学习设置"
          aria-label="打开学习设置"
        >设置</button>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">字幕</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="library">收藏库</button>
        <button class="tab" data-tab="study">学习</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <section id="localAsrPanel" class="local-asr-panel" hidden aria-label="英文原声转写">
        <div class="learning-actions">
          <button class="learning-button" id="localAsrStart" type="button">转写英文原声</button>
          <button class="learning-button" id="localAsrCancel" type="button" hidden>取消转写</button>
          <button class="learning-button" id="localAsrApply" type="button" hidden>载入英文转写</button>
          <button class="learning-button" id="localAsrRestore" type="button" hidden>恢复原站字幕</button>
        </div>
        <p id="localAsrStatus" role="status"></p>
        <progress id="localAsrProgress" max="100" value="0" hidden aria-label="原声转写进度"></progress>
      </section>
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon">&#9655;</div>
        <div class="welcome-title">开始视频学习</div>
        <div class="welcome-desc">打开哔哩哔哩或 YouTube 视频，点击「英语学习」或扩展图标，开始阅读字幕。</div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">正在读取视频字幕…</div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon">&#9888;</div>
          <div class="error-title" id="errorTitle">出错了</div>
          <div class="error-message" id="errorMessage">操作未完成，请重试。</div>
          <button class="error-btn" id="errorBtn">重试</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-title">完整字幕</div>
            <div class="sticky-control-row">
              <div
                class="transcript-mode-control"
                id="transcriptModeControl"
                role="group"
                aria-label="字幕语言"
              >
                <button
                  class="transcript-mode-btn active"
                  type="button"
                  data-transcript-mode="original"
                  aria-pressed="true"
                >原文</button>
                <button
                  class="transcript-mode-btn"
                  type="button"
                  data-transcript-mode="zh"
                  aria-pressed="false"
                >中文</button>
                <button
                  class="transcript-mode-btn"
                  type="button"
                  data-transcript-mode="bilingual"
                  aria-pressed="false"
                >双语</button>
                <span
                  class="translation-spinner"
                  id="langSpinner"
                  aria-label="正在翻译"
                ></span>
              </div>
              <div class="transcript-actions">
                <button class="enhance-btn" id="returnToPlaybackBtn" type="button" title="定位到当前视频时间对应的字幕，暂停时也可使用">回到播放位置</button>
                <button class="enhance-btn" id="copyTranscriptBtn">复制</button>
                <button class="enhance-btn" id="exportTranscriptBtn">导出</button>
              </div>
            </div>
            <p id="playbackPositionStatus" role="status" aria-live="polite"></p>
            <div class="transcript-search" role="search">
              <label class="sr-only" for="transcriptSearchInput">搜索字幕</label>
              <div class="transcript-search-field">
                <input
                  id="transcriptSearchInput"
                  type="search"
                  maxlength="200"
                  autocomplete="off"
                  placeholder="搜索字幕"
                />
                <button
                  class="transcript-search-clear"
                  id="transcriptSearchClear"
                  type="button"
                  aria-label="清空字幕搜索"
                  disabled
                >&#215;</button>
              </div>
              <span
                class="transcript-search-count"
                id="transcriptSearchCount"
                aria-live="polite"
              >0 / 0</span>
              <button
                class="transcript-search-nav"
                id="transcriptSearchPrevious"
                type="button"
                aria-label="上一条搜索结果"
                disabled
              >&#8593;</button>
              <button
                class="transcript-search-nav"
                id="transcriptSearchNext"
                type="button"
                aria-label="下一条搜索结果"
                disabled
              >&#8595;</button>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <div class="sticky-control-row overview-control-row">
            <div
              class="transcript-mode-control"
              id="overviewModeControl"
              role="group"
              aria-label="概览语言"
            >
              <button
                class="transcript-mode-btn active"
                type="button"
                data-overview-mode="original"
                aria-pressed="true"
              >原文</button>
              <button
                class="transcript-mode-btn"
                type="button"
                data-overview-mode="zh"
                aria-pressed="false"
              >中文</button>
              <button
                class="transcript-mode-btn"
                type="button"
                data-overview-mode="bilingual"
                aria-pressed="false"
              >双语</button>
              <span
                class="translation-spinner"
                id="overviewLangSpinner"
                aria-label="正在翻译概览"
              ></span>
            </div>
          </div>

          <!-- Full-video summary -->
          <div class="section overview-summary-section">
            <div class="section-title">内容摘要</div>
            <div class="summary-box">
              <div class="summary-text" id="overviewSummary">切换到概览后将生成内容摘要</div>
            </div>
          </div>

          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >章节将在这里显示</li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">重点语句</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">切换到概览后将提取重点语句…</div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Library -->
        <div class="tab-panel" data-panel="library">
          <div class="library-switch" role="group" aria-label="收藏类别">
            <button
              class="library-switch-btn"
              id="libraryNotesTab"
              type="button"
              aria-pressed="true"
              aria-controls="libraryNotesView"
            >笔记</button>
            <button
              class="library-switch-btn"
              id="libraryVocabularyTab"
              type="button"
              aria-pressed="false"
              aria-controls="libraryVocabularyView"
            >单词</button>
            <button class="library-switch-btn" id="librarySentencesTab" type="button" aria-pressed="false" aria-controls="librarySentencesView">长难句</button>
          </div>

          <div id="learningLibraryToolbar"></div>
          <div id="librarySentencesView" class="library-view" hidden><div id="sentencesList"></div></div>
          <div class="library-view" id="libraryNotesView" hidden>
            <div class="section">
              <div class="section-header">
                <div class="section-title">已存笔记</div>
                <div class="notes-filter">
                  <button
                    class="enhance-btn active"
                    id="notesFilterThis"
                    aria-pressed="true"
                  >当前视频</button>
                  <button
                    class="enhance-btn"
                    id="notesFilterAll"
                    aria-pressed="false"
                  >全部笔记</button>
                </div>
              </div>
              <p class="notes-intro" id="notesIntro">点击视频旁的「记笔记」保存当前片段，也可以从概览保存重点语句。</p>
              <div id="notesList"></div>
            </div>
          </div>

          <div
            class="library-view"
            id="libraryVocabularyView"
          >
            <div class="section">
              <p class="notes-intro" id="vocabularyIntro"></p>
              <div id="vocabularyList"></div>
            </div>
          </div>
        </div>

        <div class="tab-panel" data-panel="study" id="studyPanel"></div>

      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      style="display: none"
    >回到播放位置</button>

    <script src="lib/platform.js"></script>
    <script src="settings.js"></script>
    <script src="lib/learning-core.js"></script>
    <script src="vendor/docx.umd.js"></script>
    <script src="lib/word-export.js"></script>
    <script src="sidepanel.js"></script>
    <script src="lib/learning-ui.js"></script>
    <script src="lib/local-asr.js"></script>
      <script src="lib/layout-ui.js"></script>
    <script src="lib/immersive.js"></script>
  </body>
</html>
